<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 麦克风：青→蓝→品红 赛博双色竖向渐变 -->
    <linearGradient id="mic" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#cafff7"/>
      <stop offset="0.33" stop-color="#34e3f5"/>
      <stop offset="0.66" stop-color="#5aa6ff"/>
      <stop offset="1" stop-color="#e23bf0"/>
    </linearGradient>
    <linearGradient id="arcCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="arcMag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <!-- HUD 能量弧（发光层，环绕麦克风的科技弧） -->
  <g fill="none" stroke-linecap="round">
    <path d="M271 183 A375 375 0 0 1 837 283" stroke="url(#arcCyan)" stroke-width="13" opacity="0.95"/>
    <path d="M753 757 A375 375 0 0 1 187 657" stroke="url(#arcMag)" stroke-width="11" opacity="0.9"/>
  </g>

  <!-- 话筒头：实心发光胶囊 -->
  <rect x="404" y="228" width="216" height="374" rx="108" fill="url(#mic)"/>
  <!-- 顶部高光反光 -->
  <ellipse cx="476" cy="318" rx="46" ry="118" fill="#ffffff" opacity="0.30"/>
  <!-- grille 音格线 -->
  <g stroke="#06101f" stroke-width="15" stroke-linecap="round" opacity="0.5">
    <line x1="436" y1="322" x2="588" y2="322"/>
    <line x1="436" y1="378" x2="588" y2="378"/>
    <line x1="436" y1="434" x2="588" y2="434"/>
  </g>
  <!-- 支架 U 弧 + 底杆 + 底座 -->
  <g fill="none" stroke="url(#mic)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M306 454 v40 a206 206 0 0 1 412 0 v-40"/>
    <path d="M512 700 v118"/>
    <path d="M396 830 h232"/>
  </g>
</svg>
