<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 柔和蓝渐变圆角磁贴（与「柔和卡片」主题同语言，accent #5b8def） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7da7f7"/>
      <stop offset="0.55" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3f6fdd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#sheen)"/>
  <!-- 内侧高光描边，一点点玻璃感 -->
  <rect x="70" y="70" width="884" height="884" rx="226" fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"/>
</svg>
