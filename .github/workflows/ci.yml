name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyperclip pynput numpy

      - name: Run unit tests
        run: python -m pytest tests/ -q

  # ───────────────────────── 原生安装包打包 ─────────────────────────
  # 仅在打 tag (v*) 时触发；三平台并行各产出本地原生安装包。
  # 模型权重不打入包，首次运行从 ModelScope 自动下载。
  package:
    name: Package (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 用 ubuntu-22.04（glibc 2.35）打包：glibc 只向后兼容，
        # 在旧系统打的包能在 22.04 及更新系统跑；用 ubuntu-latest(24.04)
        # 打出的包链接 GLIBC_2.38/2.39，会在 22.04 上加载失败。
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: (Linux) 安装 PortAudio 系统库
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: 安装打包依赖（CPU 版 torch，版本与 GPU 运行时锁死一致）
        run: |
          python -m pip install --upgrade pip
          # 2.11.0 = Python 3.10 最后一个有 cu128 轮子的版本；
          # 应用内「启用 GPU 加速」下载的运行时是 2.11.0+cu128，必须同版本插队替换
          pip install torch==2.11.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 版本号写入 core/version.py（与 tag 同步）
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          printf '"""应用版本号（CI 构建时自动与 git tag 同步）。"""\n\n__version__ = "%s"\n' "$ver" > core/version.py
          cat core/version.py

      - name: PyInstaller 打包
        run: pyinstaller voice_input.spec

      - name: (Linux) 打 .deb
        if: runner.os == 'Linux'
        run: bash build_deb.sh "${GITHUB_REF_NAME#v}"

      - name: (Windows) Inno Setup 打 setup.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer\windows\voice-input.iss

      - name: (macOS) 打 .dmg
        if: runner.os == 'macOS'
        run: bash build_dmg.sh "${GITHUB_REF_NAME#v}"

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/*.deb
            dist/*.dmg
            installer/windows/Output/*.exe
          if-no-files-found: ignore
          retention-days: 3

  # ───────────────────────── 发布 Release ─────────────────────────
  release:
    name: Create Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载三平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.dmg
          body: |
            ## 📥 下载原生安装包

            从下方 **Assets** 选择对应平台的安装包，开箱即用（无需配置 Python 环境）：

            | 平台 | 文件 | 安装方式 |
            |------|------|----------|
            | 🐧 Linux (X11) | `voice-input_*_amd64.deb` | `sudo dpkg -i voice-input_*.deb` |
            | 🪟 Windows x64 | `voice-input-*-setup.exe` | 双击运行安装向导 |
            | 🍎 macOS (Apple Silicon) | `voice-input-*.dmg` | 打开 dmg 拖入「应用程序」 |

            > ⚠️ 三平台首次运行会自动下载约 1GB 的 SenseVoice 模型（联网）。
            > 安装包内置 **CPU 版 PyTorch**；N 卡 GPU 加速请改用源码安装，见 README。
            > macOS 需在「系统设置 → 隐私与安全性 → 辅助功能 / 麦克风」中授权后才能录音与模拟按键。

            ---

            <details><summary>📦 偏好源码安装？点此展开</summary>

            ```bash
            # Linux
            bash install.sh
            # Windows
            powershell -ExecutionPolicy Bypass -File install_windows.ps1
            # macOS
            bash install_macos.sh
            ```
            </details>
